name: Release

on:
  push:
    tags:
      # This repo's own tags come from `make tag_release`, which uses
      # tailscale.com/cmd/mkversion's VERSION_LONG (e.g.
      # "1.103.187-t92ec10267-gedd351679") -- no "v" prefix, unlike upstream
      # tailscale/tailscale-android's fetched tags (which do have one and
      # must not trigger this).
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. 1.103.187-t92ec10267-gedd351679). Must already exist.'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          make libtailscale debug-symbols version gradle-dependencies build-unstripped-aar
          (cd android && ./gradlew assembleRelease)

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          UNSIGNED=android/build/outputs/apk/release/android-release-unsigned.apk
          SIGNED=my-app-signed.apk
          "${BUILD_TOOLS}apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias my-key \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --out "$SIGNED" \
            "$UNSIGNED"
          "${BUILD_TOOLS}apksigner" verify "$SIGNED"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: my-app-signed.apk
